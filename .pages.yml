media:
  - name: images
    label: 图片
    input: media/images
    output: /media/images
    rename: safe
    extensions: [jpg, jpeg, png, webp, gif]
  - name: audio
    label: 音频
    input: media/audio
    output: /media/audio
    rename: safe
    categories: [audio]

content:
  - name: site
    label: 首页内容与布局
    type: file
    path: content/site.json
    format: json
    fields:
      - name: site_name
        label: 网站名称
        type: string
        required: true
      - name: name
        label: 昵称
        type: string
        required: true
      - name: tagline
        label: 一句话介绍
        type: string
        required: true
      - name: intro
        label: 首页介绍
        type: text
      - name: avatar
        label: 头像
        type: image
        options:
          media: images
      - name: email
        label: 联系邮箱
        type: string
      - name: song_title
        label: 推荐歌曲
        type: string
      - name: song_note
        label: 听歌感受
        type: text
      - name: song_url
        label: 歌曲链接
        type: string
      - name: theme_color
        label: 主题颜色
        type: string
        description: 填写十六进制颜色，例如 #2858df
        pattern:
          regex: "^#[0-9a-fA-F]{6}$"
          message: "请填写类似 #2858df 的六位颜色"
      - name: page_width
        label: 页面宽度
        type: select
        options:
          values:
            - name: narrow
              label: 窄版
            - name: standard
              label: 标准
            - name: wide
              label: 宽版
      - name: hero_layout
        label: 首页头部布局
        type: select
        options:
          values:
            - name: split
              label: 文字和头像左右排列
            - name: stacked
              label: 文字和头像上下排列
      - name: card_columns
        label: 电脑端兴趣卡片列数
        type: select
        options:
          values:
            - name: "1"
              label: 一列
            - name: "2"
              label: 两列
            - name: "3"
              label: 三列
      - name: corner_style
        label: 卡片圆角
        type: select
        options:
          values:
            - name: square
              label: 直角
            - name: soft
              label: 小圆角
            - name: round
              label: 大圆角
      - name: layout_sections
        label: 首页区块顺序与显示
        type: object
        list:
          min: 1
          max: 5
          collapsible:
            collapsed: true
            summary: "{section}"
        fields:
          - name: section
            label: 区块
            type: select
            required: true
            options:
              values:
                - name: about-note
                  label: 关于这里
                - name: favorites
                  label: 喜欢与分享
                - name: stories
                  label: 最近分享
                - name: links
                  label: 常用链接
                - name: contact
                  label: 联系方式
          - name: visible
            label: 显示这个区块
            type: boolean
            default: true

  - name: posts
    label: 趣事与分享
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        options:
          format: yyyy-MM-dd
      - name: category
        label: 分类
        type: string
        description: 例如：日常、音乐、照片
      - name: body
        label: 正文
        type: text
        required: true
      - name: image
        label: 配图
        type: image
        options:
          media: images
      - name: gallery
        label: 更多照片
        type: object
        list: true
        fields:
          - name: image
            label: 照片
            type: image
            options:
              media: images
          - name: caption
            label: 照片说明
            type: string
      - name: audio
        label: 音频
        type: file
        options:
          media: audio
          categories: [audio]

  - name: links
    label: 常用链接
    type: file
    path: content/links.json
    format: json
    list: true
    fields:
      - name: name
        label: 名称
        type: string
        required: true
      - name: description
        label: 简介
        type: string
      - name: url
        label: 网址
        type: string
        required: true
      - name: icon
        label: 图标文字
        type: string
        description: 例如：书、♫、◎

  - name: resume
    label: 个人简历
    type: file
    path: content/resume.json
    format: json
    fields:
      - name: name
        label: 姓名
        type: string
        required: true
      - name: title
        label: 职业定位
        type: string
      - name: summary
        label: 个人简介
        type: text
      - name: avatar
        label: 头像
        type: image
        options:
          media: images
      - name: location
        label: 所在地
        type: string
      - name: email
        label: 邮箱
        type: string
      - name: website
        label: 网站链接
        type: string
      - name: skills
        label: 技能
        type: object
        list: true
        fields:
          - name: name
            label: 技能名称
            type: string
          - name: level
            label: 熟练度（0-100）
            type: number
      - name: experience
        label: 工作/项目经历
        type: object
        list: true
        fields:
          - name: role
            label: 职位
            type: string
          - name: company
            label: 公司 / 项目
            type: string
          - name: period
            label: 时间
            type: string
          - name: description
            label: 描述
            type: text
      - name: education
        label: 教育经历
        type: object
        list: true
        fields:
          - name: school
            label: 学校
            type: string
          - name: degree
            label: 专业 / 学位
            type: string
          - name: period
            label: 时间
            type: string
      - name: languages
        label: 语言能力
        type: object
        list: true
        fields:
          - name: name
            label: 语言
            type: string
          - name: level
            label: 水平
            type: string

settings:
  content:
    merge: direct
  commit:
    templates:
      create: "content: 添加 {filename}"
      update: "content: 更新 {filename}"
      delete: "content: 删除 {filename}"
